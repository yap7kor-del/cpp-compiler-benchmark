name: C/C++ CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Static Analysis (Run before compiling to catch errors early)
  static-analysis:
    name: Static Analysis & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python (For Conan)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Conan & Static Analysis Tools
        run: |
          pip install conan
          conan profile detect --force
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tidy

      - name: Install Dependencies with Conan
        run: |
          conan install . --build=missing -s build_type=Release

      - name: Generate Compile Commands with CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run Cppcheck
        run: |
          cppcheck --enable=all --inconclusive --std=c++20 --suppress=missingIncludeSystem src/

      - name: Run Clang-Tidy
        run: |
          clang-tidy -p build src/math/*.cpp src/dsp/*.cpp src/main.cpp

  # Job 2: Build Matrix for Compilers, Architectures, and Optimizations
  build-and-test:
    name: Build (${{ matrix.compiler }}, ${{ matrix.arch }}, ${{ matrix.opt_flag }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- GCC builds on Linux (x86_64) ---
          - os: ubuntu-latest
            compiler: gcc
            cxx: g++
            arch: x86_64
            opt_flag: -O0
            build_type: Debug
          - os: ubuntu-latest
            compiler: gcc
            cxx: g++
            arch: x86_64
            opt_flag: -O3
            build_type: Release

          # --- Clang builds on Linux (x86_64) ---
          - os: ubuntu-latest
            compiler: clang
            cxx: clang++
            arch: x86_64
            opt_flag: -O2
            build_type: Release
          - os: ubuntu-latest
            compiler: clang
            cxx: clang++
            arch: x86_64
            opt_flag: -Ofast
            build_type: Release

          # --- Cross-Compilation for ARM (Cortex-M or Aarch64) in CI ---
          - os: ubuntu-latest
            compiler: arm-none-eabi-gcc
            cxx: arm-none-eabi-g++
            arch: arm-cortex-m4
            opt_flag: -Os -mcpu=cortex-m4 -mthumb --specs=nosys.specs
            build_type: MinSizeRel

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python (For Conan)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Conan
        run: |
          pip install conan

      - name: Install System Compilers
        run: |
          sudo apt-get update
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            sudo apt-get install -y g++
          elif [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
            sudo update-alternatives --install /usr/bin/cc cc /usr/bin/clang 100
            sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/clang++ 100
            sudo update-alternatives --set cc /usr/bin/clang
            sudo update-alternatives --set c++ /usr/bin/clang++
          elif [ "${{ matrix.compiler }}" = "arm-none-eabi-gcc" ]; then
            sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
          fi
          if [ "${{ matrix.compiler }}" != "arm-none-eabi-gcc" ]; then
            echo "CC=${{ matrix.compiler }}" >> $GITHUB_ENV
            echo "CXX=${{ matrix.cxx }}" >> $GITHUB_ENV
          fi

      - name: Configure Conan Profile
        run: |
          conan profile detect --force

      - name: Run Conan Install
        run: |
          if [ "${{ matrix.compiler }}" = "arm-none-eabi-gcc" ]; then
            conan install --requires="fmt/11.0.2" -g CMakeDeps -s build_type=${{ matrix.build_type }} -o "fmt/*:header_only=True" --output-folder="build/${{ matrix.build_type }}/generators"
          else
            conan install . --build=missing -s build_type=${{ matrix.build_type }}
          fi

      - name: Configure CMake
        run: |
          TOOLCHAIN_ARG=""
          if [ -f "build/${{ matrix.build_type }}/generators/conan_toolchain.cmake" ]; then
            TOOLCHAIN_ARG="-DCMAKE_TOOLCHAIN_FILE=build/${{ matrix.build_type }}/generators/conan_toolchain.cmake"
          else
            TOOLCHAIN_ARG="-DCMAKE_PREFIX_PATH=build/${{ matrix.build_type }}/generators"
          fi
          cmake -B build \
            $TOOLCHAIN_ARG \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_FLAGS="${{ matrix.opt_flag }}" \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build Project
        run: |
          cmake --build build --parallel

      - name: Run Benchmarks (Only on Native OS)
        if: matrix.compiler != 'arm-none-eabi-gcc'
        run: |
          ./build/EmbeddedApp
